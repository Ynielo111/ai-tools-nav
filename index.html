      function renderCompareRows(tl) {
        return tl.map(function(t, i) {
          return '<tr class="expand-row" onclick="var d=document.getElementById(\'expRow\'+i);d.classList.toggle(\'show\');" style="cursor:pointer;"><td class="td-name">' + t.icon + ' ' + t.name + '</td><td>' + starHtml(t.rating) + '</td><td>' + pricingTag(t.pricing) + '</td><td>' + t.audience + '</td><td class="td-review">' + t.review + '</td></tr><tr class="expanded-detail" id="expRow'+i+'"><td colspan="5"><div class="exp-review">💡 ' + t.review + '</div><div class="exp-actions"><a href="' + t.url + '" target="_blank" rel="noopener" class="exp-link">访问官网 →</a><label class="compare-check" onclick="event.stopPropagation()"><input type="checkbox" onchange="toggleCompare(\'' + t.id + '\', this.checked)"> 加入对比</label></div></td></tr>';
        }).join('');
      }
      html += '<section class="compare-section"><div class="section-title">📊 ' + cat.name + '横向对比表</div><div class="section-subtitle">点击表头排序，点击行展开详情，勾选工具加入对比</div><div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th>工具 <span class="sort-btn" onclick="sortCompareTable(\'name\')">⇅</span></th><th>评分 <span class="sort-btn" onclick="sortCompareTable(\'rating\')">⇅</span></th><th>价格 <span class="sort-btn" onclick="sortCompareTable(\'price\')">⇅</span></th><th>适合人群</th><th>一句话点评</th></tr></thead><tbody id="compareTbody">' + renderCompareRows(tools) + '</tbody></table></div></section>';


  // Remaining tools
  if (tools.length > 5) {
    html += '<section><div class="section-title">📋 更多' + cat.name + '</div><div class="card-grid">';
    tools.slice(5).forEach(function(t) {
      html += '<a href="' + t.url + '" target="_blank" rel="noopener" class="tool-card"><span class="icon">' + t.icon + '</span><div class="name">' + t.name + '</div><div class="desc">' + t.desc + '</div><div class="tags">' + pricingTag(t.pricing) + t.tags.map(function(tg) { return '<span class="tag">' + tg + '</span>'; }).join('') + '</div></a>';
    });
    html += '</div></section>';
  }

  document.getElementById('mainContent').innerHTML = html;
  rebindSearch();
}

function renderSearchResults() {
  var q = currentSearch;
  if (!q) { renderHome(); return; }
  updateMeta(null);
  _suppressHash = true;
  window.location.hash = 'search=' + encodeURIComponent(q);

  var filtered = DATA.tools.filter(function(t) {
    return t.name.toLowerCase().indexOf(q) !== -1 || t.desc.toLowerCase().indexOf(q) !== -1 || t.tags.some(function(tg) { return tg.toLowerCase().indexOf(q) !== -1; });
  });

  var eq = escapeHtml(q);
  var html = '<a href="/" class="back-btn" onclick="showHome();return false;">← 返回首页</a>';
  html += '<div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" value="' + eq + '" placeholder="搜索 AI 工具..."></div>';
  html += '<div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary);">搜索 "<strong>' + eq + '</strong>" 找到 <strong>' + filtered.length + '</strong> 个结果</div>';

  if (filtered.length === 0) {
    html += '<div class="empty-state show"><div class="empty-icon">🔍</div><p>没有找到匹配的工具，试试其他关键词</p><p style="font-size:12px;color:var(--text-muted);margin-top:4px;">推荐搜索：ChatGPT、AI绘画、免费、编程</p></div>';
  } else {
    html += '<div class="card-grid">';
    filtered.forEach(function(t) {
      html += '<a href="' + t.url + '" target="_blank" rel="noopener" class="tool-card"><span class="icon">' + t.icon + '</span><div class="name">' + t.name + ' ' + starHtml(t.rating) + '</div><div class="desc">' + t.desc + '</div><div class="desc" style="color:var(--text-secondary);font-style:italic;margin-top:2px;">💬 ' + t.review + '</div><div class="tags">' + pricingTag(t.pricing) + t.tags.map(function(tg) { return '<span class="tag">' + tg + '</span>'; }).join('') + '</div></a>';
    });
    html += '</div>';
  }

  document.getElementById('mainContent').innerHTML = html;
  rebindSearch();
}

function rebindSearch() {
  var si = document.getElementById('searchInput');
  if (!si) return;
  si.addEventListener('input', function(e) {
    currentSearch = e.target.value.toLowerCase().trim();
    if (currentSearch) { renderSearchResults(); }
    else if (currentCategory) { renderCategory(currentCategory); }
    else { renderHome(); }
  });
}

function rebindCategoryLinks() {
  document.querySelectorAll('.cat-card').forEach(function(card) {
    card.addEventListener('click', function(e) { e.preventDefault(); var id = card.getAttribute('href').slice(1); showCategory(id); });
  });
}

var compareSelected = [];

function toggleCompare(id, checked) {
  if (checked) {
    if (compareSelected.length >= 4) { alert('最多选择4个工具进行对比'); return; }
    compareSelected.push(id);
  } else {
    compareSelected = compareSelected.filter(function(x) { return x !== id; });
  }
  updateCompareBar();
}
function updateCompareBar() {
  var bar = document.getElementById('compareBar');
  if (compareSelected.length >= 2) {
    bar.classList.add('show');
    var tags = '';
    compareSelected.forEach(function(id) {
      var t = DATA.tools.find(function(x) { return x.id === id; });
      if (t) tags += '<span class="cb-tag">' + t.icon + ' ' + t.name + '</span>';
    });
    document.getElementById('cbTools').innerHTML = tags;
  } else {
    bar.classList.remove('show');
  }
}
function goCompare() {
  if (compareSelected.length < 2) return;
  var sorted = compareSelected.slice().sort();
  var key = sorted.join(',');
  var comparePages = {
    'chatgpt,claude,gemini': '/articles/chatgpt-vs-claude-vs-gemini.html',
    'chatgpt,claude': '/articles/chatgpt-vs-claude-vs-gemini.html',
    'deepseek,chatgpt': '/articles/deepseek-vs-chatgpt.html',
    'kimi,tongyi': '/articles/kimi-vs-tongyi.html',
    'dalle3,midjourney,stable-diffusion': '/articles/midjourney-vs-dalle-vs-sd.html',
    'cursor,github-copilot,windsurf': '/articles/github-copilot-vs-cursor-vs-windsurf.html',
    'pika,runway,sora': '/articles/sora-vs-runway-vs-pika.html',
    'elevenlabs,suno': '/articles/suno-vs-elevenlabs.html',
    'beautiful-ai,gamma,tome': '/articles/gamma-vs-beautiful-vs-tome.html',
    'feishu,microsoft-copilot,notion': '/articles/notion-vs-feishu-vs-copilot.html',
    'grammarly,jasper,notion-ai': '/articles/jasper-vs-notion-ai-vs-grammarly.html',
    'claude-code,cursor': '/articles/claude-code-vs-cursor.html',
    'dify,coze,langchain': '/articles/dify-vs-coze-vs-langchain.html',
    'heygen,synthesia': '/articles/heygen-vs-synthesia.html',
    'leonardo,midjourney': '/articles/leonardo-vs-midjourney.html',
    'canva-ai,remove-bg': '/articles/canva-vs-remove-bg.html',
    'capcut,descript': '/articles/capcut-vs-descript.html',
    'huggingface,replicate': '/articles/huggingface-vs-replicate.html',
  };
  var page = comparePages[key];
  if (page) {
    window.location.href = page;
  } else {
    alert('该组合暂无专属对比文章，请浏览 /compare/ 选择工具或查看 /articles/ 了解相关对比。');
  }
}
init();
</script>
<div class="compare-bar" id="compareBar">
  <span style="font-size:13px;color:var(--text-secondary);white-space:nowrap;">已选对比：</span>
  <div class="cb-tools" id="cbTools"></div>
  <button class="cb-btn" onclick="goCompare()">开始对比</button>
</div>
<footer class="footer" style="border-top:none;">
  <p style="font-size:11px;color:var(--text-muted);"><a href="/articles/" style="color:var(--accent-start);text-decoration:none;">📝 全部文章</a> · <a href="/compare/" style="color:var(--accent-start);text-decoration:none;">🔬 工具对比</a> · <a href="/sitemap.xml" style="color:var(--accent-start);text-decoration:none;">站点地图</a></p>
</footer>
</body>
