<style>
:root {
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --card-border: #e8ecf1;
  --text-primary: #1e293b;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-start: #6366f1;
  --accent-end: #8b5cf6;
  --tag-bg: #f1f5f9;
  --ad-bg-start: #fef3c7;
  --ad-bg-end: #fde68a;
  --ad-border: #f59e0b;
  --radius: 12px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text-primary); line-height: 1.5; min-height: 100vh;
}
.header { background:#fff; border-bottom:1px solid var(--card-border); position:sticky; top:0; z-index:100; }
.header-inner { max-width:1200px; margin:0 auto; padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; }
.logo { font-size:20px; font-weight:700; color:var(--text-primary); text-decoration:none; }
.nav { display:flex; gap:20px; }
.nav a { font-size:13px; color:var(--text-muted); text-decoration:none; transition:color 0.2s; }
.nav a:hover { color:var(--accent-start); }
.main { max-width:1200px; margin:0 auto; padding:24px; }
.search-box { display:flex; align-items:center; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:0 20px; box-shadow:var(--shadow-md); transition:box-shadow 0.2s; }
.search-box:focus-within { box-shadow:0 4px 20px rgba(99,102,241,0.15); border-color:#c7d2fe; }
.search-icon { font-size:16px; margin-right:10px; flex-shrink:0; }
#searchInput { flex:1; border:none; outline:none; padding:14px 0; font-size:14px; background:transparent; color:var(--text-primary); }
#searchInput::placeholder { color:var(--text-secondary); }
.category-bar { display:flex; gap:8px; margin:20px 0; flex-wrap:wrap; overflow-x:auto; padding-bottom:4px; }
.cat-btn { padding:6px 16px; border-radius:20px; font-size:12px; border:1px solid #e2e8f0; background:#fff; color:var(--text-muted); cursor:pointer; white-space:nowrap; transition:all 0.2s; }
.cat-btn:hover { border-color:#c7d2fe; color:var(--accent-start); }
.cat-btn.active { background:linear-gradient(135deg,var(--accent-start),var(--accent-end)); color:#fff; border-color:transparent; box-shadow:0 2px 8px rgba(99,102,241,0.25); }
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.tool-count { font-size:12px; color:var(--text-secondary); }
.card-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
.tool-card { background:#fff; border:1px solid var(--card-border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm); cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; display:block; text-decoration:none; color:inherit; }
.tool-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.tool-card .icon { font-size:28px; margin-bottom:8px; display:block; }
.tool-card .name { font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
.tool-card .desc { font-size:11px; color:var(--text-secondary); margin-bottom:10px; line-height:1.4; }
.tool-card .tags { display:flex; gap:4px; flex-wrap:wrap; }
.tool-card .tag { background:var(--tag-bg); padding:2px 8px; border-radius:4px; font-size:10px; color:var(--text-muted); }
.ad-banner { grid-column:1 / -1; background:linear-gradient(135deg,var(--ad-bg-start),var(--ad-bg-end)); border:2px dashed var(--ad-border); border-radius:var(--radius); padding:20px; text-align:center; }
.ad-banner .ad-title { font-size:14px; font-weight:600; color:#92400e; margin-bottom:4px; }
.ad-banner .ad-desc { font-size:11px; color:#a16207; }
.ad-banner a { color:inherit; text-decoration:none; display:block; }
.empty-state { text-align:center; padding:60px 20px; display:none; }
.empty-state.show { display:block; }
.empty-state .empty-icon { font-size:48px; margin-bottom:12px; }
.empty-state p { font-size:14px; color:var(--text-secondary); }
.footer { text-align:center; padding:32px 24px; border-top:1px solid var(--card-border); margin-top:40px; }
.footer p { font-size:11px; color:var(--text-secondary); }
@media (max-width:1023px) { .card-grid { grid-template-columns:repeat(2, 1fr); } }
@media (max-width:639px) { .card-grid { grid-template-columns:1fr; } .header-inner { padding:0 16px; } .main { padding:16px; } .category-bar { gap:6px; } .cat-btn { padding:5px 12px; font-size:11px; } }
</style>

let currentCategory = 'all';
let currentSearch = '';

function init() {
  renderCategories();
  renderTools();
  document.getElementById('searchInput').addEventListener('input', function(e) {
    currentSearch = e.target.value.toLowerCase().trim();
    renderTools();
  });
}

function renderCategories() {
  var bar = document.getElementById('categoryBar');
  bar.innerHTML = '<button class="cat-btn active" data-cat="all">全部</button>';
  DATA.categories.forEach(function(cat) {
    bar.innerHTML += '<button class="cat-btn" data-cat="' + cat.id + '">' + cat.icon + ' ' + cat.name + '</button>';
  });
  bar.querySelectorAll('.cat-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      bar.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      renderTools();
    });
  });
}

function renderTools() {
  var filtered = DATA.tools;
  if (currentCategory !== 'all') {
    filtered = filtered.filter(function(t) { return t.category === currentCategory; });
  }
  if (currentSearch) {
    filtered = filtered.filter(function(t) {
      return t.name.toLowerCase().indexOf(currentSearch) !== -1 ||
             t.description.toLowerCase().indexOf(currentSearch) !== -1 ||
             t.tags.some(function(tag) { return tag.toLowerCase().indexOf(currentSearch) !== -1; });
    });
  }

  document.getElementById('toolCount').textContent = '共 ' + filtered.length + ' 个工具';

  var grid = document.getElementById('cardGrid');
  var empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  var html = '';
  var AD_INTERVAL = 6;
  filtered.forEach(function(tool, index) {
    html += '<a href="' + tool.url + '" target="_blank" rel="noopener" class="tool-card">';
    html += '<span class="icon">' + tool.icon + '</span>';
    html += '<div class="name">' + tool.name + '</div>';
    html += '<div class="desc">' + tool.description + '</div>';
    html += '<div class="tags">';
    tool.tags.forEach(function(t) { html += '<span class="tag">' + t + '</span>'; });
    html += '</div></a>';

    if ((index + 1) % AD_INTERVAL === 0 && index + 1 < filtered.length && DATA.ads.length > 0) {
      var ad = DATA.ads[Math.floor((index + 1) / AD_INTERVAL) % DATA.ads.length];
      html += '<div class="ad-banner"><a href="' + (ad.link || '#') + '" target="_blank" rel="noopener">';
      html += '<div class="ad-title">📢 ' + ad.title + '</div>';
      html += '<div class="ad-desc">' + ad.description + '</div>';
      html += '</a></div>';
    }
  });
  grid.innerHTML = html;
}

init();
</script>
