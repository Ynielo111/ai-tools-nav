<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机猫 Meme — AI ToolNav</title>
<link rel="canonical" href="https://www.aitnav.com/tools/cat-meme.html">
<meta name="robots" content="noindex, follow">
<meta name="description" content="随机猫咪图片生成器，每次点击展示一张可爱的猫咪图片，治愈你的心情。">
<style>
:root{--bg:#0a0a1a;--card-bg:rgba(255,255,255,0.06);--card-border:rgba(255,255,255,0.10);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-start:#818cf8;--accent-end:#a78bfa;--radius:14px;--shadow-md:0 4px 16px rgba(0,0,0,0.3);--shadow-lg:0 8px 30px rgba(0,0,0,0.4);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;min-height:100vh;position:relative;z-index:0;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 40%,rgba(168,85,247,0.30) 0%,transparent 50%),radial-gradient(circle at 70% 15%,rgba(59,130,246,0.25) 0%,transparent 50%),radial-gradient(circle at 85% 80%,rgba(6,182,212,0.20) 0%,transparent 50%);filter:blur(60px);}
.header{background:rgba(10,10,26,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:100;}
.header-inner{max-width:1000px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:20px;font-weight:700;color:var(--text-primary);text-decoration:none;}
.nav{display:flex;gap:20px;}
.nav a{font-size:13px;color:var(--text-secondary);text-decoration:none;transition:color 0.2s;}
.nav a:hover{color:var(--accent-start);}
.main{max-width:640px;margin:0 auto;padding:32px 24px;position:relative;z-index:1;text-align:center;}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent-start);font-size:13px;text-decoration:none;margin-bottom:20px;}
.back-btn:hover{text-decoration:underline;}

.tool-header{margin-bottom:24px;}
.tool-header .tool-icon{font-size:56px;margin-bottom:8px;display:block;}
.tool-header h1{font-size:28px;font-weight:800;color:var(--text-primary);margin-bottom:4px;}
.tool-header p{font-size:13px;color:var(--text-muted);}

.cat-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:20px;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center;}
.cat-card img{max-width:100%;max-height:500px;display:block;}
.cat-card .loading{color:var(--text-muted);font-size:14px;}
.cat-card .error-state{color:var(--text-muted);padding:40px;}
.cat-card .error-state .err-icon{font-size:40px;margin-bottom:8px;}

.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;}
.btn:hover{opacity:0.9;transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,var(--accent-start),var(--accent-end));color:#fff;}
.btn-secondary{background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-primary);}

.counter{font-size:12px;color:var(--text-muted);margin-bottom:8px;}

.privacy-note{text-align:center;margin-top:24px;padding:12px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.15);border-radius:10px;}
.privacy-note p{font-size:12px;color:var(--text-secondary);margin:0;}

@media(max-width:600px){
  .cat-card{min-height:200px;}
  .cat-card img{max-height:350px;}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo">AI ToolNav</a>
    <nav class="nav">
      <a href="/">首页</a>
      <a href="/tools/">在线工具</a>
      <a href="/articles/">文章</a>
    </nav>
  </div>
</header>

<main class="main">
  <a href="/tools/" class="back-btn">← 返回工具列表</a>

  <div class="tool-header">
    <span class="tool-icon">🐱</span>
    <h1>随机猫 Meme</h1>
    <p>随机展示可爱猫咪，点击按钮换一张</p>
  </div>

  <div class="cat-card" id="catCard">
    <div class="loading" id="loadingState">🐾 加载中...</div>
    <img id="catImage" style="display:none;" alt="随机猫咪">
    <div class="error-state" id="errorState" style="display:none;">
      <div class="err-icon">😿</div>
      <p>加载失败，请再试一次</p>
    </div>
  </div>

  <div class="counter" id="counter"></div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btnNewCat">🎲 再来一张</button>
    <button class="btn btn-secondary" id="btnDownload">💾 下载图片</button>
  </div>

  <div class="privacy-note">
    <p>🐱 图片来自 Cataas / PlaceKitten，智能切换可用源</p>
  </div>
</main>

<script>
var catCount = 0;
var currentImageUrl = '';
var apiIndex = 0;
var TIMEOUT = 6000;

var loading = document.getElementById('loadingState');
var image = document.getElementById('catImage');
var errorEl = document.getElementById('errorState');

var FALLBACK_IMAGES = [
  'https://placekitten.com/600/500',
  'https://placekitten.com/500/600',
  'https://placekitten.com/550/500',
  'https://placekitten.com/500/550',
  'https://placekitten.com/600/450',
  'https://placekitten.com/500/500',
  'https://placekitten.com/450/600',
  'https://placekitten.com/550/550'
];

function buildSources() {
  var sources = [];
  sources.push('https://cataas.com/cat?t=' + Date.now());
  // Shuffle fallback images and pick a few
  var shuffled = FALLBACK_IMAGES.slice().sort(function(){ return Math.random() - 0.5; });
  for (var i = 0; i < shuffled.length; i++) {
    sources.push(shuffled[i]);
  }
  return sources;
}

var sources = [];
var timer = null;

function tryNextSource() {
  if (apiIndex >= sources.length) {
    // All sources failed
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    return;
  }
  var url = sources[apiIndex];
  image.src = url;
}

function loadCat() {
  if (timer) clearTimeout(timer);
  sources = buildSources();
  apiIndex = 0;

  loading.style.display = 'block';
  image.style.display = 'none';
  errorEl.style.display = 'none';

  image.onload = function() {
    if (timer) clearTimeout(timer);
    loading.style.display = 'none';
    image.style.display = 'block';
    currentImageUrl = sources[apiIndex];
    catCount++;
    document.getElementById('counter').textContent = '已展示 ' + catCount + ' 只猫咪';
  };

  image.onerror = function() {
    apiIndex++;
    tryNextSource();
  };

  tryNextSource();

  timer = setTimeout(function() {
    if (image.style.display === 'none' || loading.style.display !== 'none') {
      apiIndex++;
      tryNextSource();
    }
  }, TIMEOUT);
}

document.getElementById('btnNewCat').addEventListener('click', loadCat);

document.getElementById('btnDownload').addEventListener('click', function(){
  if (!currentImageUrl) return;
  fetch(currentImageUrl)
    .then(function(r){ return r.blob(); })
    .then(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cat-meme-' + Date.now() + '.jpg';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    })
    .catch(function(){
      alert('下载失败，请尝试右键保存图片');
    });
});

// Load first cat on page load
loadCat();
</script>

<script src="/js/affiliate.js"></script>
</body>
</html>
