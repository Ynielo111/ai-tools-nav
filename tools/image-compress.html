<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片压缩 — AI ToolNav</title>
<link rel="canonical" href="https://www.aitnav.com/tools/image-compress.html">
<meta name="robots" content="noindex, follow">
<meta name="description" content="免费在线图片压缩工具，拖拽上传图片，实时预览压缩效果，对比前后大小。支持JPG/PNG/WebP格式，浏览器本地处理。">
<style>
:root{--bg:#0a0a1a;--card-bg:rgba(255,255,255,0.06);--card-border:rgba(255,255,255,0.10);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-start:#818cf8;--accent-end:#a78bfa;--radius:14px;--shadow-md:0 4px 16px rgba(0,0,0,0.3);--green:#34d399;--red:#f87171;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;min-height:100vh;position:relative;z-index:0;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 40%,rgba(168,85,247,0.30) 0%,transparent 50%),radial-gradient(circle at 70% 15%,rgba(59,130,246,0.25) 0%,transparent 50%),radial-gradient(circle at 85% 80%,rgba(6,182,212,0.20) 0%,transparent 50%);filter:blur(60px);}
.header{background:rgba(10,10,26,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:100;}
.header-inner{max-width:1000px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:20px;font-weight:700;color:var(--text-primary);text-decoration:none;}
.nav{display:flex;gap:20px;}
.nav a{font-size:13px;color:var(--text-secondary);text-decoration:none;transition:color 0.2s;}
.nav a:hover{color:var(--accent-start);}
.main{max-width:800px;margin:0 auto;padding:32px 24px;position:relative;z-index:1;}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent-start);font-size:13px;text-decoration:none;margin-bottom:20px;}
.back-btn:hover{text-decoration:underline;}

.tool-header{text-align:center;margin-bottom:28px;}
.tool-header .tool-icon{font-size:48px;margin-bottom:8px;}
.tool-header h1{font-size:26px;font-weight:800;color:var(--text-primary);margin-bottom:4px;}
.tool-header p{font-size:13px;color:var(--text-muted);}

.upload-zone{background:var(--card-bg);border:2px dashed var(--card-border);border-radius:16px;padding:60px 20px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:20px;}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--accent-start);background:rgba(129,140,248,0.06);}
.upload-zone .uz-icon{font-size:48px;margin-bottom:12px;}
.upload-zone .uz-text{font-size:15px;color:var(--text-primary);margin-bottom:4px;font-weight:600;}
.upload-zone .uz-hint{font-size:12px;color:var(--text-muted);}
.upload-zone input[type=file]{display:none;}

.result-section{display:none;}
.result-section.show{display:block;}

.preview-row{display:flex;gap:12px;margin-bottom:20px;}
.preview-col{flex:1;text-align:center;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:16px;}
.preview-col h3{font-size:13px;color:var(--text-secondary);margin-bottom:8px;}
.preview-col img{max-width:100%;max-height:300px;border-radius:8px;}
.preview-col .size-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-top:8px;}
.preview-col .size-original{background:rgba(248,113,113,0.2);color:var(--red);}
.preview-col .size-compressed{background:rgba(52,211,153,0.2);color:var(--green);}

.controls{margin-bottom:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;}
.controls label{font-size:13px;color:var(--text-secondary);}
.controls input[type=range]{width:200px;accent-color:var(--accent-start);}
.controls .val{font-size:13px;color:var(--text-muted);min-width:40px;}
.controls select{padding:8px 12px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;color:var(--text-primary);font-size:13px;}

.save-row{text-align:center;margin-bottom:20px;display:none;}
.save-row.show{display:block;}
.save-info{font-size:26px;font-weight:800;color:var(--green);margin-bottom:12px;}
.save-detail{font-size:13px;color:var(--text-secondary);margin-bottom:12px;}

.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;}
.btn:hover{opacity:0.9;}
.btn-primary{background:linear-gradient(135deg,var(--accent-start),var(--accent-end));color:#fff;}
.btn-secondary{background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-primary);}
.btn-download{background:var(--green);color:#0a0a1a;}

@media(max-width:600px){.preview-row{flex-direction:column;}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo">AI ToolNav</a>
    <nav class="nav"><a href="/">首页</a><a href="/tools/">在线工具</a><a href="/articles/">文章</a></nav>
  </div>
</header>
<main class="main">
  <a href="/tools/" class="back-btn">← 返回工具列表</a>
  <div class="tool-header"><div class="tool-icon">🗜️</div><h1>图片压缩</h1><p>上传图片，调整质量，对比前后大小</p></div>

  <div class="upload-zone" id="uploadZone">
    <div class="uz-icon">📂</div>
    <div class="uz-text">点击上传或拖拽图片</div>
    <div class="uz-hint">支持 JPG / PNG / WebP · 浏览器本地处理</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="result-section" id="resultSection">
    <div class="preview-row">
      <div class="preview-col">
        <h3>原图</h3>
        <img id="originalPreview" alt="原图">
        <div class="size-badge size-original" id="originalSize">-</div>
      </div>
      <div class="preview-col">
        <h3>压缩后</h3>
        <img id="compressedPreview" alt="压缩后">
        <div class="size-badge size-compressed" id="compressedSize">-</div>
      </div>
    </div>

    <div class="controls">
      <label>质量</label>
      <input type="range" id="quality" min="10" max="100" value="70">
      <span class="val" id="qualityVal">70%</span>
      <label>格式</label>
      <select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
    </div>

    <div class="save-row show" id="saveRow">
      <div class="save-info" id="savePercent"></div>
      <div class="save-detail" id="saveDetail"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-download" id="btnDownload">📥 下载压缩图片</button>
      <button class="btn btn-secondary" id="btnReset">🔄 重新上传</button>
    </div>
  </div>
</main>

<script>
var originalFile = null;
var originalDataUrl = null;
var compressedBlob = null;

var uploadZone = document.getElementById('uploadZone');
var fileInput = document.getElementById('fileInput');
var resultSection = document.getElementById('resultSection');

uploadZone.addEventListener('click',function(){fileInput.click();});
uploadZone.addEventListener('dragover',function(e){e.preventDefault();uploadZone.classList.add('drag-over');});
uploadZone.addEventListener('dragleave',function(){uploadZone.classList.remove('drag-over');});
uploadZone.addEventListener('drop',function(e){
  e.preventDefault();uploadZone.classList.remove('drag-over');
  var f = e.dataTransfer.files[0];
  if(f) processFile(f);
});
fileInput.addEventListener('change',function(){
  var f = fileInput.files[0];
  if(f) processFile(f);
});

function formatSize(bytes){
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(2) + ' MB';
}

function processFile(file){
  if (!file.type.startsWith('image/')){
    alert('请上传图片文件');
    return;
  }
  originalFile = file;
  document.getElementById('originalSize').textContent = formatSize(file.size);

  var reader = new FileReader();
  reader.onload = function(e){
    originalDataUrl = e.target.result;
    document.getElementById('originalPreview').src = originalDataUrl;
    uploadZone.style.display = 'none';
    resultSection.classList.add('show');
    compress();
  };
  reader.readAsDataURL(file);
}

function compress(){
  if (!originalDataUrl) return;
  var quality = document.getElementById('quality').value / 100;
  var format = document.getElementById('format').value;
  document.getElementById('qualityVal').textContent = Math.round(quality*100)+'%';

  var img = new Image();
  img.onload = function(){
    var canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    canvas.toBlob(function(blob){
      compressedBlob = blob;
      var url = URL.createObjectURL(blob);
      document.getElementById('compressedPreview').src = url;
      document.getElementById('compressedSize').textContent = formatSize(blob.size);

      var saved = originalFile.size - blob.size;
      var percent = Math.round((saved / originalFile.size) * 100);
      document.getElementById('savePercent').textContent = '减小了 ' + percent + '%';
      document.getElementById('saveDetail').textContent = '原图 '+formatSize(originalFile.size)+' → 压缩后 '+formatSize(blob.size)+'，节省 '+formatSize(Math.max(0,saved));
    }, format, quality);
  };
  img.src = originalDataUrl;
}

document.getElementById('quality').addEventListener('input', compress);
document.getElementById('format').addEventListener('change', compress);

document.getElementById('btnDownload').addEventListener('click',function(){
  if (!compressedBlob) return;
  var ext = document.getElementById('format').value.split('/')[1];
  var a = document.createElement('a');
  a.href = URL.createObjectURL(compressedBlob);
  a.download = 'compressed.' + ext;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
});

document.getElementById('btnReset').addEventListener('click',function(){
  originalFile = null; originalDataUrl = null; compressedBlob = null;
  resultSection.classList.remove('show');
  uploadZone.style.display = 'block';
  fileInput.value = '';
  document.getElementById('quality').value = 70;
  document.getElementById('qualityVal').textContent = '70%';
});
</script>
<script src="/js/affiliate.js"></script>
</body>
</html>
